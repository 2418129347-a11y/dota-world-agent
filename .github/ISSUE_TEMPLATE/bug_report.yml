name: Bug report
description: Report a reproducible problem without including credentials or private data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include SMTP authorization codes, tokens, private email addresses, or full private logs."
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or version
  - type: textarea
    id: safe_logs
    attributes:
      label: Redacted logs
      description: Include only logs with all secrets and private addresses removed.
