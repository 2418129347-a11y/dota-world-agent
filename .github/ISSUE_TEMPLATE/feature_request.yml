name: Feature request
description: Suggest a source, editorial rule, delivery option, or product improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Relevant sources or examples
      description: For new news sources, include the original publisher, URL, and proposed trust tier.
