name: Daily Dota World Digest

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Optional Asia/Shanghai report date (YYYY-MM-DD)"
        required: false
        type: string
  schedule:
    # Low-contention Beijing heartbeats: 07:43 waits until 08:00, then 08:17
    # and 09:17 provide bounded fallbacks. Runs after 09:29 are still rejected.
    - cron: "43 23 * * *"
    - cron: "17 0 * * *"
    - cron: "17 1 * * *"

permissions:
  contents: read

concurrency:
  group: dota-world-digest-daily
  cancel-in-progress: false

jobs:
  time_gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.clock.outputs.should_run }}
      local_time: ${{ steps.clock.outputs.local_time }}
    steps:
      - name: Check actual Beijing delivery window
        id: clock
        shell: bash
        run: |
          local_time="$(TZ=Asia/Shanghai date +%Y-%m-%dT%H:%M:%S%z)"
          hour="$(TZ=Asia/Shanghai date +%H)"
          minute="$(TZ=Asia/Shanghai date +%M)"
          minute_of_day=$((10#$hour * 60 + 10#$minute))
          should_run=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            should_run=true
          elif (( minute_of_day >= 390 && minute_of_day < 570 )); then
            should_run=true
            if (( minute_of_day < 480 )); then
              wait_seconds=$(( (480 - minute_of_day) * 60 ))
              echo "Early heartbeat at $local_time; waiting ${wait_seconds}s for 08:00 Asia/Shanghai"
              sleep "$wait_seconds"
              local_time="$(TZ=Asia/Shanghai date +%Y-%m-%dT%H:%M:%S%z)"
            fi
          fi
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          echo "local_time=$local_time" >> "$GITHUB_OUTPUT"
          echo "Asia/Shanghai now: $local_time; should run: $should_run"

  digest:
    needs: time_gate
    if: needs.time_gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore seen-item state
        uses: actions/cache@v4
        with:
          path: state
          key: dota-digest-state-${{ github.run_id }}
          restore-keys: |
            dota-digest-state-

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build digest
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-nano' }}
          MAIL_PROVIDER: smtp
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.qq.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME || secrets.EMAIL_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD || secrets.EMAIL_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          DIGEST_TO: ${{ secrets.DIGEST_TO || secrets.EMAIL_TO }}
          ENABLE_SEND: ${{ vars.ENABLE_SEND }}
        run: |
          args=(--output-dir output --state-file state/seen.json --summarizer auto)
          report_date="${{ inputs.date }}"
          if [[ -n "$report_date" ]]; then
            args+=(--date "$report_date" --ignore-seen)
          else
            args+=(--write-state)
          fi
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            args+=(--skip-if-sent-today)
          fi
          if [[ "$ENABLE_SEND" == "true" ]]; then
            args+=(--send)
          fi
          python .agents/skills/dota-world-digest/scripts/dota_digest.py "${args[@]}"

      - name: Upload digest and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dota-world-digest-${{ github.run_number }}
          path: output
          if-no-files-found: warn
          retention-days: 14
