name: Daily Dota World Digest

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Optional Asia/Shanghai report date (YYYY-MM-DD)"
        required: false
        type: string
  schedule:
    # Beijing 07:43 waits until 08:00. Delayed runs deliver on the actual day.
    - cron: "43 23 * * *"
    - cron: "17 0 * * *"
    - cron: "17 1 * * *"
    - cron: "19 8 * * *"

permissions:
  contents: read

concurrency:
  group: dota-world-digest-daily
  cancel-in-progress: false

jobs:
  time_gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check actual Beijing delivery window
        run: python .agents/skills/dota-world-digest/scripts/dota_news/workflow_ops.py gate

  digest:
    needs: time_gate
    runs-on: ubuntu-latest
    outputs:
      delivery_ok: ${{ steps.health.outputs.delivery_ok }}
      reason: ${{ steps.health.outputs.reason }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore seen-item state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: dota-digest-state-${{ github.run_id }}
          restore-keys: |
            dota-digest-state-

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build digest
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-nano' }}
          MAIL_PROVIDER: smtp
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.qq.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME || secrets.EMAIL_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD || secrets.EMAIL_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          DIGEST_TO: ${{ secrets.DIGEST_TO || secrets.EMAIL_TO }}
          ENABLE_SEND: ${{ vars.ENABLE_SEND }}
          REPORT_DATE: ${{ inputs.date }}
        run: |
          args=(--output-dir output --state-file state/seen.json --summarizer auto)
          report_date="$REPORT_DATE"
          if [[ -n "$report_date" ]]; then
            args+=(--date "$report_date" --ignore-seen)
          else
            args+=(--write-state)
          fi
          if [[ -z "$report_date" ]]; then
            args+=(--skip-if-sent-today)
          fi
          if [[ "$ENABLE_SEND" == "true" ]]; then
            args+=(--send)
          fi
          python .agents/skills/dota-world-digest/scripts/dota_digest.py "${args[@]}"

      - name: Save delivery state even after an ambiguous SMTP failure
        if: always() && hashFiles('state/seen.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state
          key: dota-digest-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify actual email delivery
        id: health
        if: always()
        env:
          ENABLE_SEND: ${{ vars.ENABLE_SEND }}
          PRIOR_STATUS: ${{ job.status }}
        run: python .agents/skills/dota-world-digest/scripts/dota_news/workflow_ops.py health

      - name: Upload digest and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dota-world-digest-${{ github.run_number }}
          path: output
          if-no-files-found: warn
          retention-days: 14

  notify:
    needs: [time_gate, digest]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Update or close the delivery failure issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DELIVERY_OK: ${{ needs.digest.outputs.delivery_ok }}
          DELIVERY_REASON: ${{ needs.digest.outputs.reason }}
          DIGEST_RESULT: ${{ needs.digest.result }}
          GATE_RESULT: ${{ needs.time_gate.result }}
        run: python .agents/skills/dota-world-digest/scripts/dota_news/workflow_ops.py notify
